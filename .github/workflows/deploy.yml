name: build & deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/${{ github.repository }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # The build must not need a database — pages fall back to empty states by design.
      - run: pnpm --filter @kcx/web build
        env:
          DATABASE_URL: postgres://unused:unused@127.0.0.1:1/unused

  images:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [web, server]
    steps:
      - uses: actions/checkout@v4
      # `github.repository` preserves the owner's casing — Ramnet-Lab/KCX — and Docker
      # requires image names to be lowercase, so every build since this workflow was written
      # died at the push step with "repository name must be lowercase". Nobody noticed because
      # deploys were being done by hand over SSH, so a red run changed nothing observable.
      - name: Lowercase the image base
        id: img
        run: echo "base=${IMAGE_BASE,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ matrix.app }}.Dockerfile
          push: true
          tags: |
            ${{ steps.img.outputs.base }}-${{ matrix.app }}:latest
            ${{ steps.img.outputs.base }}-${{ matrix.app }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  deploy:
    needs: images
    runs-on: ubuntu-latest
    # Skipped automatically until the SSH secrets exist, so the pipeline is useful
    # (typecheck + images) before there is a server to deploy to.
    #
    # ⚠ Before turning DEPLOY_ENABLED on: this job pulls prebuilt images and runs plain
    # `docker compose`, i.e. docker-compose.yml — the PRODUCTION stack. The live server
    # currently runs `docker-compose.dev.yml --profile full`, which BUILDS from source and
    # names its volumes kcx-dev_*. Enabling this without first migrating the host to the prod
    # stack would bring up a second, empty deployment beside the real one rather than
    # updating it.
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    steps:
      - name: Lowercase the image base
        id: img
        run: echo "base=${IMAGE_BASE,,}" >> "$GITHUB_OUTPUT"
      - name: Pull and restart on the host
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -euo pipefail
            cd ${{ secrets.DEPLOY_PATH }}
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            export KCX_IMAGE_WEB=${{ steps.img.outputs.base }}-web:${{ github.sha }}
            export KCX_IMAGE_SERVER=${{ steps.img.outputs.base }}-server:${{ github.sha }}
            git pull --ff-only
            docker compose pull web server
            docker compose up -d
            docker image prune -f
