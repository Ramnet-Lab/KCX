# Production stack. One VPS, four containers, no orchestrator.
#
#   cp .env.example .env   # fill in the values marked REQUIRED
#   docker compose up -d
#
# Caddy terminates TLS (essential — passkeys refuse to run without https) and routes
# /ws to the socket.io worker, everything else to Next.

name: kcx

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kcx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-kcx}
      # Bucketing and candle keys are UTC by contract; pin it so a host default can't
      # silently re-key the time series.
      TZ: UTC
      PGTZ: UTC
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/backup:/backup
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kcx} -d ${POSTGRES_DB:-kcx}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Not published: only the app containers reach it, over the compose network.

  server:
    build:
      context: .
      dockerfile: docker/server.Dockerfile
    image: ${KCX_IMAGE_SERVER:-kcx-server:local}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-kcx}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-kcx}
      UEX_API_BASE: ${UEX_API_BASE:-https://api.uexcorp.uk/2.0}
      UEX_API_TOKEN: ${UEX_API_TOKEN:-}
      WS_PORT: "4000"
      WEB_ORIGINS: ${PUBLIC_ORIGIN}
      TZ: UTC

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    image: ${KCX_IMAGE_WEB:-kcx-web:local}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      # The worker owns migrations; let it finish before the site serves traffic.
      server:
        condition: service_started
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-kcx}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-kcx}
      # Browsers connect to the public origin, not the container name.
      NEXT_PUBLIC_WS_URL: ${PUBLIC_ORIGIN}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN}
      RP_ID: ${RP_ID}
      IP_HASH_SALT: ${IP_HASH_SALT:?set IP_HASH_SALT in .env}
      UPLOAD_DIR: /app/uploads
      ALLOW_DEV_LOGIN: "false"
      TZ: UTC
    volumes:
      # Uploaded contract images must outlive the container.
      - uploads:/app/uploads

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [web, server]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      KCX_DOMAIN: ${KCX_DOMAIN:?set KCX_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  uploads:
  db-data:
  caddy-data:
  caddy-config:
